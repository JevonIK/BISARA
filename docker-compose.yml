services:
  database:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: bisara
      POSTGRES_USER: bisara
      POSTGRES_PASSWORD: bisara_dev
    ports:
      - '127.0.0.1:5432:5432'
    volumes:
      - bisara_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U bisara -d bisara']
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: ./backend
    env_file:
      - ./backend/.env
    environment:
      DATABASE_URL: postgresql+asyncpg://bisara:bisara_dev@database:5432/bisara
    command: >-
      sh -c "alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port 8000"
    ports:
      - '127.0.0.1:8000:8000'
    depends_on:
      database:
        condition: service_healthy
    healthcheck:
      test:
        [
          'CMD',
          'python',
          '-c',
          "import urllib.request; urllib.request.urlopen('http://localhost:8000/health', timeout=3)",
        ]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  bisara_postgres_data:
